function link(){const a=[...S.subs],b={...S.studs},c=[...(S.depts||DEPTS)];DEPTS.length=0;DEPTS.push(...c);S.depts=DEPTS;S.pw=S.pw||{};subs.length=0;subs.push(...a);Object.keys(studs).forEach(k=>delete studs[k]);Object.assign(studs,b);S.subs=subs;S.studs=studs}

[].forEach((u,k)=>{const z=(si+k*2)%7,sd=z==3?"draft":z==5?"submitted":"approved";st[s.id+"|"+u]=sd;
studs[s.dept+"|"+s.yr].forEach(t=>{const key=s.id+"|"+u+"|"+t.roll;if(sd=="draft"&&r()<.5)return;if(r()<.06){m[key]="AB";return}const a=SCH[u].map(c=>Math.round(c[0]*(.3+r()*.7)));q[key]=a;m[key]=a.reduce((p,c)=>p+c,0)})})});

try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.subs)S=seed();link();

tm();

function wEntry(term,id,u){if(!ONLINE)return;const t=S.T[term];if(!t)return;const pre=id+"|"+u+"|",rows={};

$("#as").onclick=()=>{const n=$("#ns").value.trim(),i=$("#ni").value.trim();if(!n||!i)return go("Enter both the subject name and the incharge.");if(subs.some(x=>x.dept==d&&x.yr==MY&&x.name.toLowerCase()==n.toLowerCase()))return go("That subject already exists.");const id=d+MY+"x"+Math.random().toString(36).slice(2,6);subs.push({id,dept:d,yr:MY,name:n,inc:i});S.cm[id]=[1,2,3,4,5].map(()=>POS.map(()=>0));save();wCfg();wCm(id);go("Added "+n+". Its incharge can now sign in and enter marks.")};
document.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>{const q=a=>document.querySelector(`[${a}="${b.dataset.si}"]`).value.trim(),v=q("data-inc"),n=q("data-nm");if(!v||!n)return go("Subject name and incharge cannot be empty.");const x=subs.find(z=>z.id==b.dataset.si);x.inc=v;x.name=n;save();wCfg();go("Subject updated.")});
document.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent="Confirm remove";return}const id=b.dataset.ds;subs.splice(subs.findIndex(x=>x.id==id),1);[S.status,S.qm].forEach(o=>Object.keys(o).forEach(k=>k.startsWith(id+"|")&&delete o[k]));purge(k=>k.startsWith(id+"|"));delete S.cm[id];save();wCfg();delCm(id);delEnt("sub",id);go("Subject removed along with its marks.")});
const addS=(r,n)=>{if(!/^\d+$/.test(r)||!n)return"Skipped: "+r+" "+n;if(studs[d+"|"+MY].some(t=>t.roll==+r))return"Skipped duplicate roll "+r;studs[d+"|"+MY].push({roll:+r,name:n});return""};
$("#at").onclick=()=>{const e=addS($("#nr").value.trim(),$("#nn").value.trim());studs[d+"|"+MY].sort((a,b)=>a.roll-b.roll);save();wClass(d+"|"+MY);go(e||"Student added.")};
$("#ab2").onclick=()=>{let c=0,bad=[];$("#bk").value.split("\n").forEach(l=>{if(!l.trim())return;const m=l.match(/^\s*(\d+)\s*[,\t ]\s*(.+)$/),e=m?addS(m[1],m[2].trim()):"Skipped: "+l.trim();e?bad.push(e):c++});studs[d+"|"+MY].sort((a,b)=>a.roll-b.roll);save();wClass(d+"|"+MY);go(`Added ${c} students.`+(bad.length?" "+bad.join("; "):""))};
document.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent="Confirm remove";return}const r=b.dataset.dt,ids=subs.filter(x=>x.dept==d&&x.yr==MY).map(x=>x.id);studs[d+"|"+MY]=studs[d+"|"+MY].filter(t=>t.roll!=r);purge(k=>{const p=k.split("|");return ids.includes(p[0])&&p[2]==r});save();wClass(d+"|"+MY);rewrite(ids);go("Student removed along with their marks.")})}
const deptAdd=()=>`<div class="card"><h3>Add a department</h3><div class="row"><div><label>Code</label><input id="dcode" placeholder="e.g. AIDS" maxlength="8"></div><div><label>Department name</label><input id="dname"></div><button id="nd">Add department</button></div></div>`;
function bulkAdd(d,y,txt){const L=studs[d+"|"+y];let c=0,bad=[];txt.split("\n").forEach(l=>{if(!l.trim())return;const m=l.match(/^\s*(\d+)\s*[,\t ]\s*(.+)$/);if(!m)return bad.push(l.trim());if(L.some(t=>t.roll==+m[1]))return bad.push("duplicate "+m[1]);L.push({roll:+m[1],name:m[2].trim()});c++});L.sort((a,b)=>a.roll-b.roll);save();wClass(d+"|"+y);return`Added ${c} students.`+(bad.length?" Skipped: "+bad.join("; "):"")}
function stuTab(s){const L=studs[s.dept+"|"+s.yr];return`<p class="mu" role="status">${note}</p><div class="card"><h3>Add students in bulk · ${dn(s.dept)} ${s.yr}</h3><p class="mu">One student per line as roll number, name. You can also load a .csv or .txt file. New students appear in every subject of this class.</p><textarea id="bk" rows="6" style="width:100%"></textarea><div class="row" style="margin-top:.5rem"><input type="file" id="bf" accept=".csv,.txt" aria-label="Load student file"><button id="ab2">Add students</button></div></div><div class="card"><h3>Class list (${L.length})</h3><div class="tbl"><table><thead><tr><th>Roll no.</th><th>Name</th></tr></thead><tbody>${L.map(t=>`<tr><td>${t.roll}</td><td>${t.name}</td></tr>`).join("")}</tbody></table></div></div>`}
function editTab(){const dep=U.dept||MD,L=subs.filter(x=>x.dept==dep&&x.yr==EY);if(!L.find(x=>x.id==ES))ES=L[0]?L[0].id:"";
return`<div class="card"><div class="row">${U.dept?"":`<div><label>Department</label><select id="edd">${DEPTS.map(d=>`<option value="${d[0]}" ${d[0]==dep?"selected":""}>${d[1]}</option>`).join("")}</select></div>`}<div><label>Year</label><select id="edy">${YRS.map(y=>`<option ${y==EY?"selected":""}>${y}</option>`).join("")}</select></div><div><label>Subject</label><select id="eds">${L.map(x=>`<option value="${x.id}" ${x.id==ES?"selected":""}>${x.name}</option>`).join("")}</select></div></div><p class="mu">Marks and the CO–PO/PSO mapping can be changed here even after a subject is submitted or approved. The test is the one chosen at the top.</p></div>`+(ES?entry()+matrix(subs.find(x=>x.id==ES),true):`<div class="card"><p class="mu">This class has no subjects yet. Add one from the data tab.</p></div>`)}
const hsh=(k,p)=>{p="mcoet|"+k+"|"+p;let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<p.length;i++){const c=p.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const accKey=(r,d,sb)=>r=="sub"?"sub|"+sb:r=="hod"||r=="dc"?r+"|"+d:r;
const defPw=k=>k=="principal"?"Principal@123":k=="acad"?"Academic@123":k=="central"?"Central@123":k.startsWith("hod|")?"Hod-"+k.slice(4)+"@123":k.startsWith("dc|")?"Dc-"+k.slice(3)+"@123":"Sub-"+k.slice(4)+"@123";
const pwOk=(k,p)=>{const h=S.pw[k];return h?h===hsh(k,p):p===defPw(k)};
const pwSelf=()=>`<div class="card"><h3>Change your password</h3><div class="row"><div><label>Current password</label><div class="pw"><input type="text" class="pwm" id="pc" name="f_pc" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="g" data-show="pc">Show</button></div></div><div><label>New password</label><div class="pw"><input type="text" class="pwm" id="pn" name="f_pn" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="g" data-show="pn">Show</button></div></div><div><label>Confirm new password</label><div class="pw"><input type="text" class="pwm" id="pq" name="f_pq" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="g" data-show="pq">Show</button></div></div><button id="ps">Save password</button></div><p class="mu" role="status">${pwm}</p></div>`;
function acctRow(k,l){return`<tr><td>${l}</td><td><span class="tag ${S.pw[k]?"t-submitted":"t-draft"}">${S.pw[k]?"Custom":"Default"}</span>${S.pw[k]?"":` <code>${defPw(k)}</code>`}</td><td><input type="text" data-pw="${k}" placeholder="New password" autocomplete="off" aria-label="New password for ${l}"></td><td><button data-spw="${k}">Set</button> <button class="g" data-rpw="${k}">Reset to default</button></td></tr>`}
function pwTab(){const d=MD,tb=rows=>`<div class="tbl"><table><thead><tr><th>Login</th><th>Password</th><th>New password</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
return`<p class="mu" role="status">${note}</p><div class="card"><h3>Reset every login</h3><p class="mu">Sets all logins except yours back to their first password, shown in the table below. People can then change their own password from the header.</p><button class="r" id="rall">Reset all passwords</button></div>
<div class="card"><h3>Institute logins</h3>${tb(acctRow("principal","Principal")+acctRow("acad","Academic Coordinator")+acctRow("central","Central Unit Test Coordinator"))}</div>
<div class="card"><h3>Department logins</h3><div style="margin-bottom:.75rem"><label>Department</label><select id="pdd">${DEPTS.map(x=>`<option value="${x[0]}" ${x[0]==d?"selected":""}>${x[1]}</option>`).join("")}</select></div>${tb(acctRow("hod|"+d,"Head of Department")+acctRow("dc|"+d,"Departmental Unit Test Coordinator")+subs.filter(x=>x.dept==d).map(x=>acctRow("sub|"+x.id,`Subject Incharge · ${x.inc} · ${x.name} (${x.yr})`)).join(""))}</div>`}
function bindPw(){note="";const go=m=>{note=m;render()},pm=m=>{pwm=m;render()};pwm="";
if($("#pdd"))$("#pdd").onchange=e=>{MD=e.target.value;render()};
if($("#rall"))$("#rall").onclick=function(){if(!this.dataset.ok){this.dataset.ok=1;this.textContent="Confirm: reset all";return}const ks=Object.keys(S.pw).filter(k=>k!="central");ks.forEach(k=>delete S.pw[k]);save();ks.forEach(wPw);go("All passwords except yours were reset to the default.")};
document.querySelectorAll("[data-spw]").forEach(b=>b.onclick=()=>{const k=b.dataset.spw,v=document.querySelector(`[data-pw="${k}"]`).value;if(v.length<6)return go("Use at least 6 characters.");S.pw[k]=hsh(k,v);save();wPw(k);go("Password set.")});
document.querySelectorAll("[data-rpw]").forEach(b=>b.onclick=()=>{delete S.pw[b.dataset.rpw];save();wPw(b.dataset.rpw);go("Password reset to the default.")});
if($("#ps"))$("#ps").onclick=()=>{const k=accKey(U.role,U.dept,U.sub),n=$("#pn").value;if(!pwOk(k,$("#pc").value))return pm("Current password is wrong.");if(n.length<6)return pm("Use at least 6 characters.");if(n!==$("#pq").value)return pm("The two new passwords do not match.");S.pw[k]=hsh(k,n);save();wPw(k);pm("Password changed.")}}
function termTab(){const L=[...S.terms].sort((a,b)=>a.id<b.id?-1:1),ays=[...new Set(L.map(t=>t.ay))];
return`<p class="mu" role="status">${note}</p><div class="card"><h3>Add academic year and semester</h3><p class="mu">Each academic year and semester keeps its own marks, approvals and attainment. Students and subjects are shared, so update them under Manage data before you start a new semester. Use the Term list in the header to switch.</p><div class="row"><div><label>Academic year</label><input id="tay" placeholder="e.g. 2026-27" maxlength="7" list="ayl" autocomplete="off"><datalist id="ayl">${ays.map(a=>`<option value="${a}">`).join("")}</datalist></div><div><label>Semester</label><select id="tsm"><option>Odd</option><option>Even</option></select></div><button id="tadd">Add</button></div></div>
<div class="card"><h3>Academic years and semesters</h3><div class="tbl"><table><thead><tr><th>Academic year</th><th>Semester</th><th>Status</th><th class="n">Marks entered</th><th></th></tr></thead><tbody>${L.map(t=>`<tr><td>${t.ay}</td><td>${t.sem}</td><td>${t.id==S.cur?'<span class="tag t-approved">Active</span>':'<span class="tag t-draft">Inactive</span>'}</td><td class="n">${Object.keys(S.T[t.id].marks).length}</td><td>${t.id==S.cur?"":`<button data-tact="${t.id}">Make active</button> <button class="r" data-tdel="${t.id}">Remove</button>`}</td></tr>`).join("")}</tbody></table></div></div>`}
function bindTerm(){const go=m=>{note=m;render()};
$("#tadd").onclick=()=>{const ay=$("#tay").value.trim(),sem=$("#tsm").value,m=ay.match(/^(\d{4})-(\d{2})$/);if(!m||m[2]!=String((+m[1]+1)%100).padStart(2,"0"))return go("Enter the academic year as two consecutive years, for example 2026-27.");const id=ay+"|"+sem;if(S.terms.some(t=>t.id==id))return go(ay+" "+sem+" semester already exists.");S.terms.push({id,ay,sem});S.terms.sort((a,b)=>a.id<b.id?-1:1);S.T[id]={marks:{},status:{},q:{},qm:{}};save();wCfg();go("Added "+ay+" "+sem+" semester. Choose Make active to start entering its marks.")};
document.querySelectorAll("[data-tact]").forEach(b=>b.onclick=()=>{useT(b.dataset.tact);S.active=b.dataset.tact;save();wCfg();go(b.dataset.tact.replace("|"," ")+" semester is now active.")});
document.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent="Confirm remove";return}const id=b.dataset.tdel;S.terms=S.terms.filter(t=>t.id!=id);delete S.T[id];save();wCfg();delEnt("term",id);go("Removed "+id.replace("|"," ")+" semester with all its marks.")})}
function settings(){return`<div class="card"><h3>Test settings</h3><div class="row"><div><label>Passing percentage</label><input id="pp" type="number" value="${S.pp}"></div><button id="ss">Save settings</button>${ONLINE?"":`<button class="r" id="rs">Reset demo data</button>`}</div><p class="mu">Maximum marks follow each test’s question paper: UT 20, PUT 60. Applies to every department.</p></div>`}
function render(){if(!U.role)return login();if(tab!="edit")ES="";if(U.role=="sub"&&!subs.find(x=>x.id==U.sub)){U={};return login()}const r=U.role;let body="",t;
if(r=="sub"){const s=subs.find(x=>x.id==U.sub);body=tabs([["entry","Enter marks"],["stu","Student list"],["dash","My result analysis"],["co","CO & PO attainment"],["cm","CO–PO/PSO mapping"]])+(tab=="entry"?entry():tab=="stu"?stuTab(s):tab=="co"?coView(s):tab=="cm"?matrix(s,true):`<h2>${s.name}</h2>${kpis(agg([s],ut))}<div class="card">${subjTable([s],null)}</div>`)}
else if(r=="dc"){body=tabs([["dash","Department analysis & approvals"],["mng","Students, subjects & incharges"],["edit","Edit marks"]])+(tab=="mng"?manage(U.dept):tab=="edit"?editTab():deptDash(U.dept,"dc"))}
else if(r=="hod"){body=tabs([["dash","Department analysis"]])+deptDash(U.dept,null)}
else{const dd=tab.startsWith("d:")?tab.slice(2):null;body=tabs([["dash","College overview"],["po","PO attainment"],...DEPTS.map(d=>["d:"+d[0],d[0]]),...(r=="central"?[["ay","Academic year & semester"],["data","Manage data"],["edit","Edit marks"],["pw","Passwords"],["set","Settings"]]:[])])+(tab=="set"?settings():tab=="pw"&&r=="central"?pwTab():tab=="ay"&&r=="central"?termTab():tab=="data"&&r=="central"?manage(MD)+deptAdd():tab=="edit"&&r=="central"?editTab():tab=="po"?collegePo():dd?deptDash(dd,r=="central"?"central":null):central())}
shell((PW?pwSelf():"")+body);wire();bindPw();
if(r=="central"&&tab=="ay")bindTerm();if(r=="sub"&&tab=="entry")bindEntry();if((r=="dc"&&tab=="mng")||(r=="central"&&tab=="data"))bindManage();
if(r=="sub"&&tab=="stu"){const s=subs.find(x=>x.id==U.sub);note="";$("#bf").onchange=e=>{const f=e.target.files[0];if(!f)return;const R=new FileReader();R.onload=()=>{$("#bk").value=R.result};R.readAsText(f)};$("#ab2").onclick=()=>{note=bulkAdd(s.dept,s.yr,$("#bk").value);render()}}
if(tab=="edit"&&(r=="dc"||r=="central")){const g=(i,fn)=>$(i)&&($(i).onchange=e=>{fn(e.target.value);render()});g("#edd",v=>{MD=v;ES=""});g("#edy",v=>{EY=v;ES=""});g("#eds",v=>{ES=v});if(ES)bindEntry()}document.querySelectorAll("[data-c]").forEach(e=>e.onchange=()=>{S.cm[ES||U.sub][e.dataset.c][e.dataset.p]=+e.value;save();wCm(ES||U.sub)});
document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{S.status[b.dataset.ap+"|"+ut]="approved";save();ent(b.dataset.ap,ut);render()});
document.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{S.status[b.dataset.rt+"|"+ut]="returned";save();ent(b.dataset.rt,ut);render()});
if($("#ss"))$("#ss").onclick=()=>{const p=+$("#pp").value;if(p>0&&p<=100){S.pp=p;save();wCfg();render()}};
if($("#rs"))$("#rs").onclick=()=>{S=seed();link();tm();save();render()}}
boot();
</script></body></html>
